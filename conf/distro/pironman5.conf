require conf/distro/rpi-build.conf

DISTRO = "pironman5"

# pironman5 specific settings
ENABLE_UART = "1"
ENABLE_SPI_BUS = "1"
ENABLE_I2C = "1"
ENABLE_IR = "1"
GPIO_IR = "13"

# pironman5 required modules
IMAGE_INSTALL:append = " \
    python3-pironman5 \
    python3-pm-auto \
    python3-pm-dashboard \
    python3-sf-rpi-status \
    lgpio \
    \
    python3-gpiozero \
    lirc \
"
