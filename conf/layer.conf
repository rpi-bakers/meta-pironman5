# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-pironman5"
BBFILE_PATTERN_meta-pironman5 = "^${LAYERDIR}/"
# higher than meta-raspberrypi to override settings
BBFILE_PRIORITY_meta-pironman5 = "10"

LAYERDEPENDS_meta-pironman5 = "core"
LAYERSERIES_COMPAT_meta-pironman5 = "scarthgap whinlatter"
